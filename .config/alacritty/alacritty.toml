# Colors follow the active Omarchy theme (was oled-neon-theme.toml, whose #bb44ff cursor showed up purple/pink).

[general]
import = [
  "~/.config/omarchy/current/theme/alacritty.toml"
]

[env]
TERM = "xterm-256color"

[font]
size = 14

[font.normal]
family = "Monaspace Radon Var"
style = "Regular"

[font.bold]
family = "Monaspace Radon Var"
style = "Bold"

[font.italic]
family = "Monaspace Radon Var"
style = "Italic"

[font.bold_italic]
family = "Monaspace Radon Var"
style = "Bold Italic"

[window]
padding.x = 14
padding.y = 14
decorations = "None"

[keyboard]
bindings = [
  { key = "F11", action = "ToggleFullscreen" },
  { key = "Insert", mods = "Shift", action = "Paste" },
  { key = "Insert", mods = "Control", action = "Copy" },
  # Send Shift+Return as CSI-u so TUIs can distinguish it from Return without treating it as Alt+Return.
  { key = "Return", mods = "Shift", chars = "\u001B[13;2u" },
  # Legacy encoding sends Alt+Shift+Return the same as Alt+Return; send CSI-u so tmux can match M-S-Enter.
  { key = "Return", mods = "Alt|Shift", chars = "\u001B[13;4u" }
]

[terminal]
osc52 = "CopyPaste"
