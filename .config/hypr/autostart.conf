# Extra autostart processes
# exec-once = uwsm app -- my-service
exec-once = uwsm app -- easyeffects --service-mode
# Live GLSL wallpaper for themes that ship live-wallpaper.glsl (no-op otherwise)
exec-once = omarchy-livewall ensure
# Sticky note daemon: keeps reminders running while the note is hidden (SUPER+SHIFT+J toggles it)
exec-once = uwsm app -- sticky daemon
# Keep idle lock off across reboots if toggled off in Setup menu (aspire-toggle-idle)
exec-once = aspire-toggle-idle apply
