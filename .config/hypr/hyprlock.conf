source = ~/.config/omarchy/current/theme/hyprlock.conf
# Label colors follow the active theme ($text_color, $subtext_color, $muted_color, $accent_color, $accent_glow),
# rendered from ~/.config/omarchy/themed/hyprlock-tokens.conf.tpl.
source = ~/.config/omarchy/current/theme/hyprlock-tokens.conf

general {
    ignore_empty_input = true
}

background {
    monitor =
    color = rgba(0, 0, 0, 1.0)
    blur_passes = 0
}

animations {
    enabled = false
}

label {
    monitor =
    text = Aspire
    color = $accent_color
    font_size = 72
    font_family = Monaspace Radon Var:style=Bold Italic
    position = 0, 300
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 4
    shadow_color = $accent_glow
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = $text_color
    font_size = 112
    font_family = Monaspace Radon Var
    position = 0, 198
    halign = center
    valign = center
    shadow_passes = 1
    shadow_size = 4
    shadow_color = $accent_glow
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    color = $subtext_color
    font_size = 22
    font_family = Monaspace Radon Var
    position = 0, 118
    halign = center
    valign = center
    shadow_passes = 0
}

input-field {
    monitor =
    size = 560, 78
    position = 0, -26
    halign = center
    valign = center

    inner_color = $inner_color
    outer_color = $accent_color
    outline_thickness = 2

    font_family = Monaspace Radon Var
    font_color = $font_color

    placeholder_text = Enter Password
    check_color = $check_color
    fail_text = <i>$FAIL ($ATTEMPTS)</i>

    rounding = 16
    shadow_passes = 1
    shadow_size = 10
    shadow_color = rgba(0, 0, 0, 0.28)
    fade_on_empty = false
}

label {
    monitor =
    text = apps  files(.)  symbols(:)  web(@)
    color = $muted_color
    font_size = 14
    font_family = Monaspace Radon Var
    position = 0, -92
    halign = center
    valign = center
    shadow_passes = 0
}

auth {
    fingerprint:enabled = false
}
