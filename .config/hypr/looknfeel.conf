# Look & feel: geometry, shadow, blur only.
# All colors (borders, groupbar) come from the active Omarchy theme: ~/.config/omarchy/current/theme/hyprland.conf

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    border_size = 2
    
    gaps_in = 4
    gaps_out = 10
    
    # Use master layout instead of dwindle
    # layout = master
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 12
    dim_inactive = false
    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(00000070)
    }
    
    # Blur behind glass (unfocused) windows. Brighter than Omarchy's 0.6/0.75 so the live crimson wallpaper
    # actually reads through them; still soft enough to keep text legible.
    blur {
        enabled = true
        size = 3
        passes = 2
        noise = 0.00
        brightness = 0.95
        contrast = 0.9
    }
} 

# https://wiki.hypr.land/Configuring/Variables/#layout
layout {
    # Avoid overly wide single-window layouts on wide screens
    # single_window_aspect_ratio = 1 1
}

# Misc settings for better OLED experience
misc {
    background_color = rgba(000000ff)  # Pure black background
    disable_hyprland_logo = true
    disable_splash_rendering = true
}
