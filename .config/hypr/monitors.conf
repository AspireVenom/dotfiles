# ---- Environment ----
env = GDK_SCALE,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,0
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = MOZ_ENABLE_WAYLAND,1
env = XCURSOR_SIZE,24

# ---- Monitors ----
# Left: ASUS 1080p (portrait)
monitor=DP-1,1920x1080@165,0x120,1,transform,3,vrr,1

# Center: MSI 32" 4K scaled (fractional scale requires corrected offset)
monitor=DP-2,3840x2160@144,1080x0,1.5,vrr,1


# Right: MSI 27" 1440p
monitor=DP-3,2560x1440@170,3640x360,1,vrr,1


# Optional: workspace pinning
workspace=1,monitor:DP-1
workspace=2,monitor:DP-2
workspace=3,monitor:DP-3

