# ---- Environment ----
env = GDK_SCALE,1
env = QT_AUTO_SCREEN_SCALE_FACTOR,0
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = MOZ_ENABLE_WAYLAND,1
env = XCURSOR_SIZE,24

# ---- Monitors ----
# Matched by EDID description so the layout survives cable/port swaps.
# Every panel is scaled to ~109 effective PPI so text and windows keep the
# same apparent size when dragged between screens.
# Layout (logical px):  ASUS 2560x1440 | MPG322UX 3072x1728 | MAG 272U portrait 1440x2560
# Vertical offsets center all three on the same midline (logical y = 1280).

# Fallback for any monitor not listed below
monitor = , preferred, auto, 1

# LEFT: ASUS XG27AQDMG - 27" 1440p QD-OLED, max 240Hz
# 2560x1440 @ scale 1 -> 2560x1440 logical, 108.8 PPI
# 240Hz 10-bit. Was held at 144Hz Sep 14-Oct 1 due to an aquamarine 0.15.0 reconnect bug (now patched):
# 0 drops in 60 s on 2026-10-01. If lag/key-repeat returns, drop back to 2560x1440@143.97 without bitdepth.
monitor = desc:ASUSTek COMPUTER INC XG27AQDMG, 2560x1440@239.97, 0x560, 1, bitdepth, 10, vrr, 2

# CENTER (MAIN): MSI MPG322UX OLED - 32" 4K QD-OLED, max 240Hz
# 3840x2160 @ scale 1.25 -> 3072x1728 logical, 110.1 PPI
monitor = desc:Microstep MPG322UX OLED, 3840x2160@240.00, 2560x416, 1.25, bitdepth, 10, vrr, 2

# RIGHT: MSI MAG 272U E16 - 27" 4K, PORTRAIT (bottom bezel on the right), on DisplayPort.
# 4K165 10-bit needs DP; its HDMI only does 4K60 8-bit (TMDS 600MHz, no FRL).
# transform 3 = rotate 270 deg (verified upright 2026-10-01; 1 was upside down).
# 3840x2160 @ scale 1.5, rotated -> 1440x2560 logical, 108.8 PPI
# Held at 120Hz (max 165): NVIDIA can't drive ASUS@240 + MPG322UX 4K@240 + this 4K@165 at once
# (tested 2026-10-12, 8-bit doesn't help). At 165 the main monitor gets bumped to 120 instead.
monitor = desc:Micro-Star Int'l Co. Ltd. MAG 272U E16, 3840x2160@120.00, 5632x0, 1.25, transform, 3, bitdepth, 10, vrr, 2

# ---- Workspace pinning ----
# Main (center) display owns workspace 1 and the odd/high workspaces.
workspace = 1, monitor:desc:Microstep MPG322UX OLED, default:true
workspace = 2, monitor:desc:ASUSTek COMPUTER INC XG27AQDMG, default:true
workspace = 3, monitor:desc:Micro-Star Int'l Co. Ltd. MAG 272U E16, default:true
workspace = 4, monitor:desc:Microstep MPG322UX OLED
workspace = 5, monitor:desc:ASUSTek COMPUTER INC XG27AQDMG
workspace = 6, monitor:desc:Micro-Star Int'l Co. Ltd. MAG 272U E16
workspace = 7, monitor:desc:Microstep MPG322UX OLED
workspace = 8, monitor:desc:ASUSTek COMPUTER INC XG27AQDMG
workspace = 9, monitor:desc:Micro-Star Int'l Co. Ltd. MAG 272U E16
workspace = 10, monitor:desc:Microstep MPG322UX OLED
