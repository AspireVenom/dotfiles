# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# Migrated from deprecated windowrulev2 (Hyprland 0.48+)
windowrule = suppress_event maximize, match:class .*

# Glass: focused window solid, unfocused windows at 85% so the live wallpaper shows through
windowrule = opacity 1.0 0.85, match:class .*

# Fix some dragging issues with XWayland
windowrule = no_focus on, match:class ^$, match:title ^$, match:xwayland true, match:float true, match:fullscreen false, match:pin false

# App-specific tweaks
source = ~/.local/share/omarchy/default/hypr/apps.conf

# Glass for terminals and browsers too. Rules apply top to bottom and the last match wins, so these override
# apps.conf's 0.97/0.9 terminal and 1.0/0.97 browser defaults. Video, game and VM apps keep apps.conf's `1 1`
# (video sites lose the browser tag there).
windowrule = opacity 1.0 0.85, match:tag terminal
windowrule = opacity 1.0 0.85, match:tag chromium-based-browser
windowrule = opacity 1.0 0.85, match:tag firefox-based-browser

# Sticky note (layer-shell namespace "sticky"): blur what's behind its translucent card; skip fully clear pixels
# (the transparent window margin) so only the card area is blurred.
layerrule = blur on, match:namespace sticky
layerrule = ignore_alpha 0.05, match:namespace sticky
